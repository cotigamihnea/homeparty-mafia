<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Content Security Policy to allow local scripts and connections -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:*;">
    <title>Mafia Game Host</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0b10'/%3E%3Cpath d='M8,32 C8,22 17,17 32,20 C47,17 56,22 56,32 C56,40 47,43 32,40 C17,43 8,40 8,32 Z' fill='%23d6483f'/%3E%3Ccircle cx='21' cy='30' r='4' fill='%230a0b10'/%3E%3Ccircle cx='43' cy='30' r='4' fill='%230a0b10'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Shared character iconography, referenced with <use> throughout the roster -->
    <svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
        <defs>
            <symbol id="icon-base-figure" viewBox="0 0 100 100">
                <path d="M14,94 C14,68 28,54 50,54 C72,54 86,68 86,94 Z" fill="currentColor"/>
                <circle cx="50" cy="38" r="16" fill="currentColor"/>
                <ellipse cx="50" cy="28" rx="23" ry="4.5" fill="currentColor"/>
                <path d="M37,28 L37,15 Q50,8 63,15 L63,28 Z" fill="currentColor"/>
            </symbol>

            <symbol id="icon-storyteller" viewBox="0 0 100 100">
                <use href="#icon-base-figure"/>
                <circle cx="78" cy="78" r="15" class="role-badge-ring"/>
                <path d="M70,83 L70,75 L74,79 L78,71 L82,79 L86,75 L86,83 Z" class="role-glyph"/>
            </symbol>

            <symbol id="icon-killer" viewBox="0 0 100 100">
                <use href="#icon-base-figure"/>
                <circle cx="78" cy="78" r="15" class="role-badge-ring"/>
                <path d="M78,66 L80.8,79 L75.2,79 Z" class="role-glyph"/>
                <rect x="72.5" y="79" width="11" height="2.6" rx="1.3" class="role-glyph"/>
                <rect x="76.8" y="81.4" width="2.4" height="5.6" class="role-glyph"/>
                <circle cx="78" cy="88.4" r="1.9" class="role-glyph"/>
            </symbol>

            <symbol id="icon-doctor" viewBox="0 0 100 100">
                <use href="#icon-base-figure"/>
                <circle cx="78" cy="78" r="15" class="role-badge-ring"/>
                <line x1="78" y1="70" x2="78" y2="86" class="role-glyph-stroke thick"/>
                <line x1="70" y1="78" x2="86" y2="78" class="role-glyph-stroke thick"/>
            </symbol>

            <symbol id="icon-cop" viewBox="0 0 100 100">
                <use href="#icon-base-figure"/>
                <circle cx="78" cy="78" r="15" class="role-badge-ring"/>
                <path d="M78,68 L87,72 L87,80 C87,86 82,90 78,92 C74,90 69,86 69,80 L69,72 Z" class="role-glyph-outline"/>
            </symbol>

            <symbol id="icon-escort" viewBox="0 0 100 100">
                <use href="#icon-base-figure"/>
                <circle cx="78" cy="78" r="15" class="role-badge-ring"/>
                <path d="M66,76 C66,70 72,68 78,69 C84,68 90,70 90,76 C90,81 85,83 78,82 C71,83 66,81 66,76 Z" class="role-glyph"/>
                <ellipse cx="73.5" cy="76" rx="2.6" ry="2.2" class="role-badge-bg-fill"/>
                <ellipse cx="82.5" cy="76" rx="2.6" ry="2.2" class="role-badge-bg-fill"/>
            </symbol>

            <symbol id="icon-jester" viewBox="0 0 100 100">
                <use href="#icon-base-figure"/>
                <circle cx="78" cy="78" r="15" class="role-badge-ring"/>
                <path d="M68,86 C68,81 73,81 78,84 C83,81 88,81 88,86 L88,89 L68,89 Z" class="role-glyph"/>
                <line x1="71" y1="81" x2="69" y2="71" class="role-glyph-stroke"/>
                <line x1="78" y1="83" x2="78" y2="65" class="role-glyph-stroke"/>
                <line x1="85" y1="81" x2="87" y2="71" class="role-glyph-stroke"/>
                <circle cx="69" cy="70" r="1.8" class="role-glyph"/>
                <circle cx="78" cy="64" r="1.8" class="role-glyph"/>
                <circle cx="87" cy="70" r="1.8" class="role-glyph"/>
            </symbol>

            <symbol id="icon-townie" viewBox="0 0 100 100">
                <use href="#icon-base-figure"/>
                <circle cx="78" cy="78" r="15" class="role-badge-ring"/>
                <path d="M68,80 L78,71 L88,80 Z" class="role-glyph"/>
                <rect x="71" y="80" width="14" height="10" rx="1" class="role-glyph"/>
                <rect x="76.5" y="84.5" width="3" height="5.5" class="role-badge-bg-fill"/>
            </symbol>

            <symbol id="icon-secret" viewBox="0 0 100 100">
                <use href="#icon-base-figure"/>
                <circle cx="78" cy="78" r="15" class="role-badge-ring"/>
                <text x="78" y="84" text-anchor="middle" class="role-glyph-text">?</text>
            </symbol>

            <symbol id="icon-dead" viewBox="0 0 100 100">
                <use href="#icon-base-figure"/>
                <circle cx="78" cy="78" r="15" class="role-badge-ring"/>
                <line x1="71" y1="71" x2="85" y2="85" class="role-glyph-stroke thick"/>
                <line x1="85" y1="71" x2="71" y2="85" class="role-glyph-stroke thick"/>
            </symbol>

            <symbol id="icon-none" viewBox="0 0 100 100">
                <use href="#icon-base-figure"/>
                <circle cx="78" cy="78" r="15" class="role-badge-ring"/>
                <circle cx="78" cy="78" r="7.5" class="role-glyph-outline"/>
                <line x1="72.5" y1="83.5" x2="83.5" y2="72.5" class="role-glyph-stroke"/>
            </symbol>

            <symbol id="icon-brand-mask" viewBox="0 0 64 64">
                <path d="M4,28 C4,16 15,10 32,13 C49,10 60,16 60,28 C60,38 50,42 32,38 C14,42 4,38 4,28 Z" fill="currentColor"/>
                <circle cx="20" cy="26" r="4.2" fill="var(--bg-base,#0a0b10)"/>
                <circle cx="44" cy="26" r="4.2" fill="var(--bg-base,#0a0b10)"/>
                <path d="M58,20 C63,16 63,10 58,7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            </symbol>
        </defs>
    </svg>

    <div class="night-sky" aria-hidden="true">
        <div class="moon"></div>
        <div class="stars">
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
    </div>

    <div class="host-container">
        <!-- Header -->
        <header class="top-bar">
            <div class="brand">
                <div class="brand-mark">
                    <svg class="brand-mask" aria-hidden="true"><use href="#icon-brand-mask"/></svg>
                    <h1>MAFIA</h1>
                </div>
                <span class="brand-tagline">A Game of Trust &amp; Deception</span>
            </div>
            <div id="header-status" class="header-status"></div>
            <div class="join-instructions" id="join-panel">
                <ol class="join-steps">
                    <li><span class="step-num">1</span>Scan the code with your phone</li>
                    <li><span class="step-num">2</span>Pick a name nobody else has</li>
                    <li><span class="step-num">3</span>Wait for the Storyteller to deal</li>
                </ol>
                <div class="join-ticket">
                    <canvas id="qr-canvas"></canvas>
                    <div class="join-copy">
                        <span class="join-label">Scan or visit to join</span>
                        <div id="join-address">Starting server&hellip;</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Area -->
        <main>
            <div class="lobby-info" id="lobby-info">
                <svg id="reveal-figure" class="reveal-figure" aria-hidden="true"><use id="reveal-figure-use" href="#icon-dead"></use></svg>
                <!-- Dynamic Phase Announcement -->
                <h2 id="phase-banner">Lobby <span id="player-count">(0)</span></h2>
                <p id="phase-description">Waiting for players to join...</p>

                <!-- Big Timer (Hidden by default) -->
                <div id="timer-display" class="timer-ring">
                    <svg class="timer-ring-svg" viewBox="0 0 120 120">
                        <circle class="timer-ring-track" cx="60" cy="60" r="52"/>
                        <circle id="timer-ring-progress" class="timer-ring-progress" cx="60" cy="60" r="52"/>
                    </svg>
                    <span id="timer-number" class="timer-number">90</span>
                </div>
            </div>

            <div id="players-grid" class="players-grid">
                <!-- Player cards will be injected here by JavaScript -->
            </div>
        </main>
    </div>

    <!-- Point to the compiled JS in the dist folder -->
    <script>require('../../dist/renderer/renderer.js')</script>
</body>
</html>
